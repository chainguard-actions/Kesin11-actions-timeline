name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
  # Comment out to enable these permissions if needed.
  # packages: write
  # deployments: write
  # id-token: write

jobs:
  draft_release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release-drafter.outputs.tag_name }}
    steps:
      # Get next version
      - uses: release-drafter/release-drafter@4d75298e00d9e34c483e5ff8c68d0ea1c1940c1e # v7
        id: release-drafter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Sample job for GitHub Actions repository.
  # It creates GitHub Releases and push semver(major, minor, patch) git tags.
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: draft_release
    steps:
      - uses: release-drafter/release-drafter@4d75298e00d9e34c483e5ff8c68d0ea1c1940c1e # v7
        id: release-drafter
        with:
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create semver outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: semver
        env:
          TAG_NAME: ${{ steps.release-drafter.outputs.tag_name }}
        with:
          script: |
            const VERSION = process.env.TAG_NAME
            const matched = VERSION.match(/(((v\d+)\.\d+).\d+)/)
            core.setOutput('major', matched[3])
            core.setOutput('minor', matched[2])
            core.setOutput('patch', matched[1])
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: "${{ steps.release-drafter.outputs.tag_name }}"
      - name: Update major and minor git tags
        env:
          TAG_NAME: ${{ steps.release-drafter.outputs.tag_name }}
          MAJOR: ${{ steps.semver.outputs.major }}
          MINOR: ${{ steps.semver.outputs.minor }}
        run: |
          git push -f origin "refs/tags/${TAG_NAME}:refs/tags/${MAJOR}"
          git push -f origin "refs/tags/${TAG_NAME}:refs/tags/${MINOR}"
