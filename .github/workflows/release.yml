name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
  # Comment out to enable these permissions if needed.
  # packages: write
  # deployments: write
  # id-token: write

jobs:
  draft_release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release-drafter.outputs.tag_name }}
    steps:
      # Get next version
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        id: release-drafter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Sample job for GitHub Actions repository.
  # It creates GitHub Releases and push semver(major, minor, patch) git tags.
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: draft_release
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        id: release-drafter
        with:
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create semver outputs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: semver
        env:
          TAG_NAME: ${{ steps.release-drafter.outputs.tag_name }}
        with:
          script: |
            const VERSION = process.env.TAG_NAME
            const matched = VERSION.match(/(((v\d+)\.\d+).\d+)/)
            core.setOutput('major', matched[3])
            core.setOutput('minor', matched[2])
            core.setOutput('patch', matched[1])
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ steps.release-drafter.outputs.tag_name }}"
      - name: Update major and minor git tags
        env:
          TAG_NAME: ${{ steps.release-drafter.outputs.tag_name }}
          MAJOR_TAG: ${{ steps.semver.outputs.major }}
          MINOR_TAG: ${{ steps.semver.outputs.minor }}
        run: |
          git push -f origin "refs/tags/${TAG_NAME}:refs/tags/${MAJOR_TAG}"
          git push -f origin "refs/tags/${TAG_NAME}:refs/tags/${MINOR_TAG}"
