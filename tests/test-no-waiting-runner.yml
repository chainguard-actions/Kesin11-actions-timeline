name: Test show-waiting-runner false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run actions-timeline with show-waiting-runner disabled
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          show-waiting-runner: "false"
        continue-on-error: true
      - name: Assert main step completed
        run: |
          echo "Action main step ran with show-waiting-runner=false"
          echo "Post step may fail under act due to GitHub API limitations with local run IDs"
          echo "PASS"
