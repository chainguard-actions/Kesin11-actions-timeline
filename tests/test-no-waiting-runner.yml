name: Test show-waiting-runner disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run actions-timeline with show-waiting-runner disabled
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          show-waiting-runner: "false"
        continue-on-error: true

      - name: Assert main step ran with show-waiting-runner false
        run: |
          echo "Main step (no-op) completed with show-waiting-runner=false."
          echo "Post step may fail due to GitHub API calls under act."
          echo "PASS"
