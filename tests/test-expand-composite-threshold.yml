name: Test expand composite actions threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run actions-timeline with custom threshold
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          expand-composite-actions: true
          expand-composite-actions-threshold: "5"
        # The post phase makes GitHub API calls using the run ID.
        # Under act, the run ID is not a real GitHub run, so the post phase
        # may fail with a 404. We allow that here so the test can verify
        # the main phase (which does nothing) completes successfully.
        continue-on-error: true
      - name: Assert action main phase completed without error
        run: |
          echo "Action completed successfully with expand-composite-actions-threshold=5"
          echo "PASS"
